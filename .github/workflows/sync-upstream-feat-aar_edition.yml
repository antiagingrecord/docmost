name: Sync upstream feat/aar_edition, Build Docker, Deploy to VPS

on:
  schedule:
    - cron: "0 * * * *" # 毎時
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        required: true
        default: full
        options:
          - full
          - sync_only
          - build_only
          - deploy_only
      ref:
        description: "Target branch or ref"
        required: true
        default: feat/aar_edition
      sha:
        description: "Target commit SHA (optional; used mainly for build_only)"
        required: false
        default: ""
      force_build:
        description: "Build even if no upstream changes (full/build_only)"
        type: boolean
        required: false
        default: false

jobs:
  sync:
    name: Sync upstream subtree
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      new_sha: ${{ steps.detect.outputs.new_sha }}

    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'sync_only'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

      - name: Configure git (user & submodule guard)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global submodule.recurse false
          git config --global submodule.active ':(top,exclude)vendor/app/apps/server/src/ee'

      - name: Add upstream remote and fetch
        run: |
          set -e
          git remote add upstream https://github.com/auxa-m45/docmost.git || true
          git fetch upstream --no-tags
          git fetch upstream feat/aar_edition --no-tags

      - name: Subtree pull and detect changes by HEAD
        id: detect
        run: |
          set -e
          BEFORE=$(git rev-parse HEAD)

          # 変更がなければ "Already up to date." になり HEAD は変わらない
          git -c submodule.recurse=false subtree pull \
            --prefix=vendor/app upstream feat/aar_edition --squash

          AFTER=$(git rev-parse HEAD)

          # private submodule 'ee' を無いもの扱いにする（必要なら追加コミット）
          NEED_FOLLOWUP=false
          if git ls-files -s -- vendor/app/apps/server/src/ee 2>/dev/null | awk '{print $1}' | grep -q '^160000$'; then
            git rm -r --cached vendor/app/apps/server/src/ee || true
            echo '/vendor/app/apps/server/src/ee/' >> .gitignore
            git add .gitignore
            NEED_FOLLOWUP=true
          fi

          if [ "$NEED_FOLLOWUP" = "true" ]; then
            # followup コミット（subtree が作ったコミットとは別）
            git commit -m "chore(sync): ignore private submodule ee" || true
            AFTER=$(git rev-parse HEAD)
          fi

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "new_sha=$AFTER" >> "$GITHUB_OUTPUT"

      - name: Push to origin
        if: steps.detect.outputs.changed == 'true'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH=${GITHUB_REF#refs/heads/}
          # workflow_dispatch の場合は inputs.ref を優先
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ inputs.ref }}"
          fi
          git push https://${REPO_TOKEN}@github.com/${{ github.repository }} HEAD:"${BRANCH}"

      - name: Log no changes
        if: steps.detect.outputs.changed != 'true'
        run: echo "No changes from upstream. Nothing to push."

  build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [sync]

    # build_only は sync を実行しないので needs.sync は skip になる可能性がある
    # そこで条件は「モード」と「changed/force_build」で判定する
    if: |
      (github.event_name == 'schedule' && needs.sync.outputs.changed == 'true') ||
      (github.event_name == 'workflow_dispatch' && (
        (inputs.mode == 'full' && (needs.sync.outputs.changed == 'true' || inputs.force_build)) ||
        (inputs.mode == 'build_only')
      ))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.sha != '') && inputs.sha || (github.event_name == 'workflow_dispatch' && inputs.ref) || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker
        uses: docker/build-push-action@v5
        with:
          context: ./vendor/app
          file: ./vendor/app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docmost:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/docmost:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 通知は「失敗時のみ」= ノイズ最小化
      - name: Docker build failure Discord Notification
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DOCKERHUB_WEBHOOK }}
          DISCORD_AVATAR: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
        with:
          args: |
            ❌ **Docker Build が失敗しました**
            リポジトリ: ${{ github.repository }}
            対象: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
            コミット: ${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build, sync]

    # deploy_only は build を実行しないので build への依存を緩める
    if: |
      (github.event_name == 'schedule' && needs.build.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && (
        (inputs.mode == 'full' && needs.build.result == 'success') ||
        (inputs.mode == 'deploy_only')
      ))

    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ~/docmost
            ./update.sh

      # 成功通知は「デプロイ成功時のみ」= 価値が高い
      - name: Deploy Success Discord Notification
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_AVATAR: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
        with:
          args: |
            ✅ **VPSへのデプロイが完了しました**
            リポジトリ: ${{ github.repository }}
            対象: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
            コミット: ${{ github.sha }}

      - name: Deploy Failure Discord Notification
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_AVATAR: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
        with:
          args: |
            ❌ **VPSへのデプロイが失敗しました**
            リポジトリ: ${{ github.repository }}
            対象: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
            コミット: ${{ github.sha }}
