name: Docker Image Build & Push

on:
  push:
    branches: [ "feat/aar_edition" ]
  pull_request:
    branches: [ "feat/aar_edition" ]
  workflow_run:
      workflows:
        - Continuous Upstream Merge
      branches:
        - feat/aar_edition
      types: 
        - completed

jobs:
  build:
    runs-on: ubuntu-latest
    
    if: ${{ github.event.workflow_run.conclusion == 'success' }} || ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/aar_edition' }} || github.event.pull_request.merged == true
    
    steps:
      - name: Workflow Started Discord Notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_AVATAR: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png

        with:
          args: |
            🚀 **Docker Build Workflow が開始されました!**
            リポジトリ: ${{ github.repository }} 
            ブランチ: ${{ github.ref }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # Build context moved to vendor/app where the application now lives
          context: ./vendor/app
          # If your Dockerfile is inside vendor/app, you can omit `file:`. If it's named differently or located elsewhere, set file: ./vendor/app/Dockerfile
          file: ./vendor/app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docmost:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/docmost:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Success Discord Notification
        uses: Ilshidur/action-discord@master
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_AVATAR: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
        with:
          args: |
            ✅ **Docker Build Workflow が成功しました**
            リポジトリ: ${{ github.repository }}
            ブランチ: ${{ github.ref }}
            コミット: ${{ github.sha }}

      - name: Failure Discord Notification
        uses: Ilshidur/action-discord@master
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_AVATAR: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
        with:
          args: |
            ❌ **Docker Build Workflow が失敗しました**
            リポジトリ: ${{ github.repository }}
            ブランチ: ${{ github.ref }}
            コミット: ${{ github.sha }}
